services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dresstrack
      POSTGRES_USER: dresstrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dresstrack-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dresstrack -d dresstrack"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dresstrack-db:
